# Cấu hình Database H2 in-memory cho Test tự động
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tạm tắt Flyway khi chạy test đơn vị nhanh
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Mock R2 properties for tests
cloudflare.r2.bucket-name=test-bucket
cloudflare.r2.access-key-id=test-key
cloudflare.r2.secret-access-key=test-secret
cloudflare.r2.endpoint=https://test.r2.cloudflarestorage.com
cloudflare.r2.public-url=https://test.r2.cloudflarestorage.com

# Mock Spring Mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@student.hcmute.edu.vn
spring.mail.password=testpassword

