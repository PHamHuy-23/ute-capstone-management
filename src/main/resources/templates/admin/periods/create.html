<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: header('Tạo Đợt Đăng Ký Mới')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5" style="max-width: 820px;">

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="nb-card">
        <div class="border-bottom border-2 border-dark pb-3 mb-4">
            <h4 class="fw-bold mb-1 text-uppercase">TẠO ĐỢT ĐĂNG KÝ ĐỀ TÀI MỚI</h4>
            <p class="text-muted small mb-0 fw-semibold">Thiết lập chu kỳ quản lý đề tài theo học kỳ / năm học</p>
        </div>

        <form th:action="@{/admin/periods/create}" th:object="${periodForm}" method="post">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-bold text-uppercase small">Tên đợt đăng ký *</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Khóa luận tốt nghiệp Học kỳ 1 (2026-2027)" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold text-uppercase small">Loại hình đề tài *</label>
                    <select th:field="*{periodType}" id="periodTypeSelect" class="form-select" required onchange="toggleSpecialFields()">
                        <option value="">-- Chọn loại hình --</option>
                        <option th:each="type : ${periodTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                    </select>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('periodType')}" th:errors="*{periodType}"></div>
                </div>

                <!-- Thời gian Giảng viên -->
                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">GV Bắt đầu nộp đề tài *</label>
                    <input type="datetime-local" th:field="*{lecturerStartDate}" class="form-control" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('lecturerStartDate')}" th:errors="*{lecturerStartDate}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">GV Hạn chót nộp đề tài *</label>
                    <input type="datetime-local" th:field="*{lecturerEndDate}" class="form-control" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('lecturerEndDate')}" th:errors="*{lecturerEndDate}"></div>
                </div>

                <!-- Thời gian Sinh viên -->
                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">SV Bắt đầu đăng ký đề tài *</label>
                    <input type="datetime-local" th:field="*{studentStartDate}" class="form-control" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('studentStartDate')}" th:errors="*{studentStartDate}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">SV Hạn chót đăng ký đề tài *</label>
                    <input type="datetime-local" th:field="*{studentEndDate}" class="form-control" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('studentEndDate')}" th:errors="*{studentEndDate}"></div>
                </div>

                <!-- Các mốc phản biện & bảo vệ (TLCN / KLTN) -->
                <div class="col-md-6" id="fieldReview">
                    <label class="form-label fw-bold text-uppercase small">Hạn GVPB nộp điểm (TLCN / KLTN)</label>
                    <input type="datetime-local" th:field="*{reviewDeadline}" class="form-control">
                    <div class="form-text small">Bắt buộc khi là Tiểu luận chuyên ngành hoặc Khóa luận.</div>
                </div>

                <div class="col-md-6" id="fieldDefense">
                    <label class="form-label fw-bold text-uppercase small">Ngày báo cáo hội đồng (KLTN)</label>
                    <input type="datetime-local" th:field="*{defenseDate}" class="form-control">
                    <div class="form-text small">Bắt buộc khi là Khóa luận tốt nghiệp.</div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-2 border-dark">
                <a href="/admin/periods" class="nb-btn">HỦY BỎ</a>
                <button type="submit" class="nb-btn nb-btn-black">
                    <i class="bi bi-calendar-check me-1"></i> TẠO ĐỢT ĐĂNG KÝ
                </button>
            </div>
        </form>
    </div>

</div>

</body>
</html>
