<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Người Dùng - HCMUTE Capstone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/brutalism.css}">
</head>
<body>

<!-- Navbar -->
<nav class="nb-navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand text-uppercase" href="/dashboard">
            <i class="bi bi-mortarboard-fill me-2"></i>HCMUTE CAPSTONE
        </a>
        <a href="/admin/users" class="nb-btn nb-btn-sm">
            <i class="bi bi-arrow-left me-1"></i>QUAY LẠI DANH SÁCH
        </a>
    </div>
</nav>

<div class="container pb-5" style="max-width: 760px;">

    <!-- Error message -->
    <div th:if="${errorMessage}" class="nb-alert nb-alert-danger py-2 d-flex align-items-center mb-3">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
    </div>

    <div class="nb-card">
        <div class="border-bottom border-2 border-dark pb-3 mb-4">
            <h4 class="fw-bold mb-1 text-uppercase">TẠO TÀI KHOẢN NGƯỜI DÙNG MỚI</h4>
            <p class="text-muted small mb-0 fw-semibold">Thiết lập thông tin tài khoản cho Giảng viên hoặc Sinh viên</p>
        </div>

        <form th:action="@{/admin/users/create}" th:object="${userForm}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Tài khoản (Mã SV / Mã GV) *</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="VD: sv_21110123" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Mật khẩu khởi tạo *</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-uppercase small">Họ và tên *</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Email liên hệ *</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="VD: user@hcmute.edu.vn" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="VD: 0987654321">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-uppercase small">Bộ môn (Khoa CNTT)</label>
                    <select th:field="*{departmentId}" class="form-select">
                        <option value="">-- Không trực thuộc hoặc Sinh viên --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name} + ' (' + ${dept.code} + ')'"></option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-uppercase small d-block">Phân quyền (Roles) *</label>
                    <div class="d-flex flex-wrap gap-3 p-3 border border-2 border-dark">
                        <div th:each="role : ${roles}" class="form-check">
                            <input class="form-check-input border-dark" type="checkbox" th:field="*{roleIds}" th:value="${role.id}" th:id="'role_' + ${role.id}">
                            <label class="form-check-label fw-semibold small" th:for="'role_' + ${role.id}" th:text="${role.name}"></label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-2 border-dark">
                <a href="/admin/users" class="nb-btn">HỦY BỎ</a>
                <button type="submit" class="nb-btn nb-btn-black">
                    <i class="bi bi-check2-circle me-1"></i> TẠO NGƯỜI DÙNG
                </button>
            </div>
        </form>
    </div>

</div>

</body>
</html>
