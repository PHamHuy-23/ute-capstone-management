<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: header('Cập Nhật Người Dùng')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5" style="max-width: 760px;">

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="nb-card">
        <div class="border-bottom border-2 border-dark pb-3 mb-4">
            <h4 class="fw-bold mb-1 text-uppercase">CẬP NHẬT THÔNG TIN NGƯỜI DÙNG</h4>
            <p class="text-muted small mb-0 fw-semibold">
                Chỉnh sửa tài khoản: <strong class="text-dark" th:text="${userForm.username}"></strong>
            </p>
        </div>

        <form th:action="@{/admin/users/edit/{id}(id=${userForm.id})}" th:object="${userForm}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{username}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Tài khoản (Không đổi)</label>
                    <input type="text" class="form-control" th:value="*{username}" disabled>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Trạng thái tài khoản</label>
                    <select th:field="*{isActive}" class="form-select">
                        <option th:value="true">Đang hoạt động</option>
                        <option th:value="false">Khóa tài khoản</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-uppercase small">Họ và tên *</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Email liên hệ *</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                    <div class="text-danger small fw-bold mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-uppercase small">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-uppercase small">Bộ môn (Khoa CNTT)</label>
                    <select th:field="*{departmentId}" class="form-select">
                        <option value="">-- Không trực thuộc hoặc Sinh viên --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name} + ' (' + ${dept.code} + ')'"></option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold text-uppercase small d-block">Phân quyền (Roles) *</label>
                    <div class="d-flex flex-wrap gap-3 p-3 border border-2 border-dark">
                        <div th:each="role : ${roles}" class="form-check">
                            <input class="form-check-input border-dark" type="checkbox" th:field="*{roleIds}" th:value="${role.id}" th:id="'role_' + ${role.id}">
                            <label class="form-check-label fw-semibold small" th:for="'role_' + ${role.id}" th:text="${role.name}"></label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-2 border-dark">
                <a href="/admin/users" class="nb-btn">HỦY BỎ</a>
                <button type="submit" class="nb-btn nb-btn-black">
                    <i class="bi bi-check2-circle me-1"></i> LƯU THAY ĐỔI
                </button>
            </div>
        </form>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
