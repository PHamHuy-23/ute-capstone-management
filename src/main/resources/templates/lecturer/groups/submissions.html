<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: header('Báo Cáo Nhóm Hướng Dẫn')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5">

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Header Actions -->
    <div class="nb-card d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <span class="nb-badge nb-badge-black" th:text="${group.groupCode}">NHOM-01</span>
                <h4 class="fw-bold mb-0 text-uppercase">BÁO CÁO CỦA NHÓM HƯỚNG DẪN</h4>
            </div>
            <p class="text-muted small mb-0 fw-semibold">
                Đề tài: <strong th:text="${group.topic.title}">Tên đề tài</strong>
            </p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a href="/lecturer/groups" class="nb-btn nb-btn-sm">
                <i class="bi bi-arrow-left me-1"></i>QUAY LẠI
            </a>
        </div>
    </div>

    <!-- Submissions Table -->
    <div class="nb-card">
        <h5 class="fw-bold text-uppercase border-bottom border-3 border-dark pb-2 mb-3">
            <i class="bi bi-file-earmark-arrow-down-fill me-2"></i>DANH SÁCH BÁO CÁO ĐÃ NỘP (<span th:text="${#lists.size(submissions)}">0</span>)
        </h5>

        <div th:if="${#lists.isEmpty(submissions)}" class="text-center py-5 text-muted fw-bold">
            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
            Nhóm này chưa nộp báo cáo tiến độ nào.
        </div>

        <div class="nb-table-container" th:if="${!#lists.isEmpty(submissions)}">
            <table class="nb-table">
                <thead>
                    <tr>
                        <th>TIÊU ĐỀ BÁO CÁO</th>
                        <th style="width: 200px;">NGƯỜI NỘP (NHÓM TRƯỞNG)</th>
                        <th style="width: 180px;">THỜI GIAN NỘP</th>
                        <th style="width: 160px;" class="text-center">TẢI VỀ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${submissions}">
                        <td>
                            <div class="fw-bold" th:text="${s.title}">Báo cáo tuần 1</div>
                            <div class="small text-muted" th:if="${s.notes != null}" th:text="${s.notes}">Ghi chú của SV</div>
                        </td>
                        <td>
                            <span class="small fw-semibold" th:text="${s.submittedBy.fullName}">Nguyễn Văn B</span>
                        </td>
                        <td>
                            <span class="small" th:text="${#temporals.format(s.submittedAt, 'dd/MM/yyyy HH:mm')}">14/10/2026 10:00</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/lecturer/groups/download-submission/' + ${s.id}}" class="nb-btn nb-btn-sm nb-btn-black">
                                <i class="bi bi-download me-1"></i>TẢI FILE
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
