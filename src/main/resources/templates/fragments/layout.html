<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<!-- Component Head chung -->
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - HCMUTE Capstone'">HCMUTE Capstone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Design System Thống nhất -->
    <link rel="stylesheet" th:href="@{/css/brutalism.css}">
</head>
<body>

<!-- Component Navbar chung -->
<nav th:fragment="navbar" class="nb-navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand text-uppercase" href="/dashboard">
            <i class="bi bi-mortarboard-fill me-2"></i>HCMUTE CAPSTONE
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="small fw-bold" sec:authorize="isAuthenticated()">
                <span class="text-decoration-underline" sec:authentication="name">User</span>
                <span class="nb-badge nb-badge-black ms-2" sec:authentication="principal.authorities"></span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline m-0" sec:authorize="isAuthenticated()">
                <button type="submit" class="nb-btn nb-btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>ĐĂNG XUẤT
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- Component Flash Messages chung -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="nb-alert nb-alert-success d-flex align-items-center mb-3">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <span th:text="${successMessage}">Thao tác thành công!</span>
    </div>
    <div th:if="${errorMessage}" class="nb-alert nb-alert-danger d-flex align-items-center mb-3">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
    </div>
</div>

<!-- Component Phân trang Neo-Brutalism chung -->
<div th:fragment="pagination(page, baseUrl)" th:if="${page != null and page.totalPages > 1}" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3 pt-3 border-top border-2 border-dark">
    <div class="small fw-bold text-uppercase">
        Hiển thị trang <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span> 
        (Tổng cộng <span th:text="${page.totalElements}">0</span> bản ghi)
    </div>
    <div class="d-flex gap-1">
        <!-- Nút Trang trước -->
        <a th:href="@{${baseUrl}(page=${page.number - 1})}" 
           th:classappend="${page.first ? 'disabled opacity-50 pe-none' : ''}"
           class="nb-btn nb-btn-sm text-decoration-none">
            <i class="bi bi-chevron-left"></i> TRƯỚC
        </a>

        <!-- Các số trang -->
        <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" 
              th:if="${i >= page.number - 2 and i <= page.number + 2}">
            <a th:href="@{${baseUrl}(page=${i})}" 
               th:text="${i + 1}"
               th:classappend="${i == page.number ? 'nb-btn-black' : ''}"
               class="nb-btn nb-btn-sm text-decoration-none px-3">1</a>
        </span>

        <!-- Nút Trang sau -->
        <a th:href="@{${baseUrl}(page=${page.number + 1})}" 
           th:classappend="${page.last ? 'disabled opacity-50 pe-none' : ''}"
           class="nb-btn nb-btn-sm text-decoration-none">
            SAU <i class="bi bi-chevron-right"></i>
        </a>
    </div>
</div>

<!-- Component Modal & Scripts chung -->
<div th:fragment="footer">
<!-- Neo-Brutalism Global Confirmation Modal -->
<div id="nbConfirmModal" class="nb-modal-backdrop">
    <div class="nb-modal-box">
        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-octagon-fill fs-3 text-dark"></i>
            <h5 class="fw-bold text-uppercase mb-0" id="nbModalTitle">XÁC NHẬN THAO TÁC</h5>
        </div>
        <p class="small text-muted mb-4" id="nbModalMessage">Bạn có chắc chắn muốn thực hiện hành động này không?</p>
        <div class="d-flex justify-content-end gap-2 pt-3 border-top border-2 border-dark">
            <button type="button" class="nb-btn nb-btn-sm" onclick="closeNbConfirm(false)">HỦY BỎ</button>
            <button type="button" class="nb-btn nb-btn-sm nb-btn-black" id="nbModalConfirmBtn">XÁC NHẬN</button>
        </div>
    </div>
</div>

<!-- Neo-Brutalism Top Loading Bar & Overlay -->
<div id="nbTopLoader"></div>
<div id="nbLoadingOverlay" class="nb-loading-overlay">
    <div class="nb-spinner"></div>
    <div class="nb-loading-text">
        <i class="bi bi-arrow-repeat me-1"></i> ĐANG TẢI DỮ LIỆU...
    </div>
</div>

<script>
    let nbConfirmResolve = null;

    function openNbConfirm(message, title = 'XÁC NHẬN THAO TÁC') {
        return new Promise((resolve) => {
            nbConfirmResolve = resolve;
            document.getElementById('nbModalTitle').innerText = title;
            document.getElementById('nbModalMessage').innerText = message;
            document.getElementById('nbConfirmModal').style.display = 'flex';
        });
    }

    function closeNbConfirm(confirmed) {
        document.getElementById('nbConfirmModal').style.display = 'none';
        if (nbConfirmResolve) {
            nbConfirmResolve(confirmed);
            nbConfirmResolve = null;
        }
    }

    document.getElementById('nbModalConfirmBtn').addEventListener('click', () => {
        closeNbConfirm(true);
    });

    // Global UI Loading Management
    function showNbLoader(showOverlay = false) {
        const bar = document.getElementById('nbTopLoader');
        if (bar) {
            bar.style.width = '35%';
            bar.style.opacity = '1';
            setTimeout(() => { bar.style.width = '75%'; }, 150);
        }
        if (showOverlay) {
            const overlay = document.getElementById('nbLoadingOverlay');
            if (overlay) overlay.style.display = 'flex';
        }
    }

    function hideNbLoader() {
        const bar = document.getElementById('nbTopLoader');
        if (bar) {
            bar.style.width = '100%';
            setTimeout(() => {
                bar.style.opacity = '0';
                setTimeout(() => { bar.style.width = '0%'; }, 250);
            }, 200);
        }
        const overlay = document.getElementById('nbLoadingOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    // Tự động kích hoạt loading khi click liên kết nội bộ
    document.addEventListener('DOMContentLoaded', () => {
        hideNbLoader();

        // Kích hoạt khi chuyển trang qua link
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !link.target && !href.startsWith('blob:') && !href.startsWith('data:')) {
                link.addEventListener('click', (e) => {
                    if (!e.ctrlKey && !e.shiftKey && !e.metaKey) {
                        showNbLoader(false);
                    }
                });
            }
        });

        // Kích hoạt khi submit form
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', () => {
                showNbLoader(true);
            });
        });
    });

    window.addEventListener('pageshow', (event) => {
        hideNbLoader();
    });
</script>
</div>

</body>
</html>
