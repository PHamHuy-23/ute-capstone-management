<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UTE Capstone Management</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            background-color: #ffffff;
            padding: 30px 30px 10px;
            text-align: center;
        }
        .login-body {
            background-color: #ffffff;
            padding: 20px 35px 35px;
        }
        .btn-primary {
            background-color: #1e3c72;
            border-color: #1e3c72;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #2a5298;
            border-color: #2a5298;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
        }
        .badge-hint {
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="mb-3 text-primary fs-1">
            <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h4 class="fw-bold text-dark">HCMUTE CAPSTONE</h4>
        <p class="text-muted small">Hệ thống Quản lý Đề tài Sinh viên</p>
    </div>

    <div class="login-body">
        <!-- Thông báo lỗi -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Tài khoản hoặc mật khẩu không chính xác!</span>
        </div>

        <!-- Thông báo đăng xuất -->
        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Đăng xuất thành công!</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Tài khoản (Mã SV / Mã GV)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập..." required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </button>
        </form>

        <!-- Hướng dẫn tài khoản test mẫu -->
        <div class="border-top pt-3 mt-3 text-center">
            <span class="text-muted small d-block mb-2">Tài khoản mẫu (mật khẩu chung: <code>123456</code>):</span>
            <div class="d-flex flex-wrap justify-content-center gap-1">
                <span class="badge bg-danger badge-hint" onclick="fillAccount('truongkhoa')">truongkhoa</span>
                <span class="badge bg-warning text-dark badge-hint" onclick="fillAccount('head_cnpm')">head_cnpm</span>
                <span class="badge bg-info text-dark badge-hint" onclick="fillAccount('gv_minh')">gv_minh</span>
                <span class="badge bg-success badge-hint" onclick="fillAccount('sv_nghia')">sv_nghia</span>
            </div>
        </div>
    </div>
</div>

<script>
    function fillAccount(username) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = '123456';
    }
</script>

</body>
</html>
