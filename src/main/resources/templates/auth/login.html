<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - HCMUTE Capstone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/brutalism.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 440px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="nb-card p-4">
        <!-- Header -->
        <div class="text-center mb-4 pb-3 border-bottom border-2 border-dark">
            <div class="display-6 fw-bold mb-1">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-black text-uppercase mb-1 tracking-tight" style="font-weight: 900;">HCMUTE CAPSTONE</h3>
            <p class="small text-muted mb-0 fw-semibold">HỆ THỐNG QUẢN LÝ ĐỀ TÀI SINH VIÊN</p>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${errorMessage}" class="nb-alert nb-alert-danger py-2 small d-flex align-items-center mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${errorMessage}">Tài khoản hoặc mật khẩu không chính xác!</span>
        </div>

        <!-- Thông báo đăng xuất -->
        <div th:if="${successMessage}" class="nb-alert nb-alert-success py-2 small d-flex align-items-center mb-3">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span th:text="${successMessage}">Đăng xuất thành công!</span>
        </div>

        <!-- Form đăng nhập -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold text-uppercase small">Tài khoản (Mã SV / Mã GV hoặc Email Trường)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Nhập mã SV/GV hoặc email @student.hcmute.edu.vn..." required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold text-uppercase small">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>

            <button type="submit" class="nb-btn nb-btn-black w-100 py-2 fs-6">
                <i class="bi bi-box-arrow-in-right me-2"></i> ĐĂNG NHẬP VÀO HỆ THỐNG
            </button>
        </form>

        <!-- Divider phân cách -->
        <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 border-dark border-2 my-0">
            <span class="px-2 fw-bold small text-uppercase bg-white text-muted">HOẶC</span>
            <hr class="flex-grow-1 border-dark border-2 my-0">
        </div>

        <!-- Nút Đăng nhập nhanh bằng Google Mail HCMUTE -->
        <a th:href="@{/oauth2/authorization/google}" 
           class="nb-btn w-100 py-2 fs-6 d-flex align-items-center justify-content-center text-decoration-none bg-white text-dark border border-2 border-dark"
           style="background-color: #ffffff; color: #1f2937; box-shadow: 4px 4px 0px #000;">
            <svg class="me-2" width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="fw-bold">ĐĂNG NHẬP VỚI GOOGLE MAIL (HCMUTE)</span>
        </a>

        <!-- Tài khoản mẫu để kiểm thử -->
        <div class="border-top border-2 border-dark pt-3 mt-4 text-center">
            <span class="small fw-bold text-uppercase d-block mb-2">Tài khoản thử nghiệm (Mật khẩu: <code>123456</code>):</span>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button type="button" class="nb-btn nb-btn-sm" onclick="fillAccount('truongkhoa')">Admin (Trưởng khoa)</button>
                <button type="button" class="nb-btn nb-btn-sm" onclick="fillAccount('head_cnpm')">Trưởng bộ môn</button>
                <button type="button" class="nb-btn nb-btn-sm" onclick="fillAccount('gv_minh')">Giảng viên</button>
                <button type="button" class="nb-btn nb-btn-sm" onclick="fillAccount('sv_nghia')">Sinh viên</button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillAccount(username) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = '123456';
    }
</script>

</body>
</html>
