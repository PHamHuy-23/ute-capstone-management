# Application Name & Port
spring.application.name=ute-capstone-management
server.port=8080

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# Khi chạy local, thay đổi user/pass cho đúng với MySQL trên máy bạn
spring.datasource.url=jdbc:mysql://localhost:3306/ute_capstone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "validate": Hibernate chỉ kiểm tra bảng xem có khớp với Flyway không, KHÔNG tự ý sửa bảng lung tung
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===============================
# MULTIPART FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# CLOUDFLARE R2 CONFIGURATION
# ===============================
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:ute-data}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.endpoint=${R2_ENDPOINT:https://00da243123f2c166648503933a7795e4.r2.cloudflarestorage.com}
cloudflare.r2.public-url=${R2_PUBLIC_URL:}

# ===============================
# SPRING MAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:notification@student.hcmute.edu.vn}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# SPRING SECURITY OAUTH2 (GOOGLE HCMUTE SSO)
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:fake-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:fake-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
