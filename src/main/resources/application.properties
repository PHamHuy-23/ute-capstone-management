# Application Name & Port
spring.application.name=ute-capstone-management
server.port=8080

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# Khi chạy local, thay đổi user/pass cho đúng với MySQL trên máy bạn
spring.datasource.url=jdbc:mysql://localhost:3306/ute_capstone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "validate": Hibernate chỉ kiểm tra bảng xem có khớp với Flyway không, KHÔNG tự ý sửa bảng lung tung
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
